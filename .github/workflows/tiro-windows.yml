# Tiro: tests and builds the Windows installer on every push. Only a push to main (or a run by hand on main: Actions >
# Tiro Windows > Run workflow) publishes it as a release, v0.2.<run number>, with latest.json for the app's own updater;
# other branches just have to build and pass the tests. Installed copies check
# about 20 s after starting and every 6 hours, and offer "Install and Restart" from the tray icon.
# Signing: secrets TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD and TAURI_UPDATER_PUBKEY (the .pub
# file). Without them the installer still builds, just without updates. Unsigned for Windows itself, like Tiro:
# SmartScreen warns on the first install (More info > Run anyway). The release links need the repo to be public.
name: Tiro Windows

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiro-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: app/tauri
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/tauri/sidecar/package-lock.json

      - name: Install sidecar dependencies
        working-directory: app/tauri/sidecar
        run: npm ci

      - name: Test sidecar
        working-directory: app/tauri/sidecar
        run: npm test

      - name: Check the workflows' inline node scripts
        working-directory: ${{ github.workspace }}
        run: node .github/scripts/check-inline-node.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/tauri/src-tauri -> target
            app/tauri/src-tauri/voice-win -> target
            app/tauri/src-tauri/hands-win -> target
          key: tiro-windows

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Same as Tiro's release.yml: fetch NSIS through the API, since GitHub's release links sometimes time out.
      - name: Prefetch NSIS for the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'tauri'; $tmp = Join-Path $env:RUNNER_TEMP 'nsis'
          New-Item -ItemType Directory -Force $dir, $tmp | Out-Null
          try {
            gh release download nsis-3.13 -R tauri-apps/binary-releases -p nsis-3.13.zip -D $tmp --clobber
            if ($LASTEXITCODE) { throw 'NSIS download failed' }
            gh release download nsis_tauri_utils-v0.5.3 -R tauri-apps/nsis-tauri-utils -p nsis_tauri_utils.dll -D $tmp --clobber
            if ($LASTEXITCODE) { throw 'nsis_tauri_utils download failed' }
            if ((Get-FileHash (Join-Path $tmp 'nsis-3.13.zip') -Algorithm SHA1).Hash -ne 'DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E') { throw 'NSIS hash mismatch' }
            if ((Get-FileHash (Join-Path $tmp 'nsis_tauri_utils.dll') -Algorithm SHA1).Hash -ne '75197FEE3C6A814FE035788D1C34EAD39349B860') { throw 'nsis_tauri_utils hash mismatch' }
            Remove-Item -Recurse -Force (Join-Path $dir 'NSIS'), (Join-Path $dir 'nsis-3.13') -ErrorAction SilentlyContinue
            Expand-Archive (Join-Path $tmp 'nsis-3.13.zip') -DestinationPath $dir
            Rename-Item (Join-Path $dir 'nsis-3.13') 'NSIS'
            $add = Join-Path $dir 'NSIS/Plugins/x86-unicode/additional'
            New-Item -ItemType Directory -Force $add | Out-Null
            Copy-Item (Join-Path $tmp 'nsis_tauri_utils.dll') $add
            Write-Host "NSIS ready in $dir"
          } catch { Write-Host "Couldn't prefetch NSIS ($_); the bundler will download it itself." }

      # The version comes from the run number, so every build is newer than the last. The updater's public key comes
      # from TAURI_UPDATER_PUBKEY; with no signing key, update bundles are left out instead of failing the build.
      - name: Set the version and the update key
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          VER="0.2.${GITHUB_RUN_NUMBER}"
          if [ -n "$KEY" ] && [ -z "$PUBKEY" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but TAURI_UPDATER_PUBKEY isn't; add the .pub file's text as that secret."; exit 1; fi
          VER="$VER" node -e '
            const fs = require("fs"), f = "src-tauri/tauri.conf.json", c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.version = process.env.VER;
            if (process.env.PUBKEY) c.plugins.updater.pubkey = process.env.PUBKEY.trim();
            if (!process.env.KEY) c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          '
          echo "VER=$VER" >> "$GITHUB_ENV"
          if [ -n "$KEY" ]; then echo "SIGNED=yes" >> "$GITHUB_ENV"; else echo "SIGNED=no" >> "$GITHUB_ENV"; echo "::warning::No signing key: this build has no auto-updates."; fi
          echo "Building Tiro $VER"

      # build.sh copies the web files, bundles the sidecar and Node, builds the voice and hands helpers, then
      # runs `cargo tauri build`, which signs the update bundle with the key below.
      - name: Build the installer
        env:
          TAURI_BUNDLES: nsis
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./build.sh release --target x86_64-pc-windows-msvc

      # The shell's and the helpers' own checks, then the hands helper against a real app (Notepad).
      - name: Test the app and its helpers
        run: |
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          cargo test --release --locked --manifest-path src-tauri/voice-win/Cargo.toml --target x86_64-pc-windows-msvc
          cargo test --release --locked --manifest-path src-tauri/hands-win/Cargo.toml --target x86_64-pc-windows-msvc
          src-tauri/binaries/tiro-hands-x86_64-pc-windows-msvc.exe --self-test
          src-tauri/binaries/tiro-hands-x86_64-pc-windows-msvc.exe --smoke

      # A normal (latest) release, so github.com/…/releases/latest/download/latest.json is always the newest one.
      # Tiro-setup.exe is the same installer under a name that never changes. Only the 5 newest builds are kept.
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          EXE="Tiro_${VER}_x64-setup.exe"
          [ -f "$B/$EXE" ] || { echo "::error::No $EXE was built"; ls "$B"; exit 1; }
          cp "$B/$EXE" "$RUNNER_TEMP/Tiro-setup.exe"
          files=("$B/$EXE" "$RUNNER_TEMP/Tiro-setup.exe")
          if [ "$SIGNED" = yes ]; then
            [ -f "$B/$EXE.sig" ] || { echo "::error::No signed update bundle was built"; exit 1; }
            files+=("$B/$EXE.sig")
          fi
          TAG="v$VER"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Tiro $VER" --target "$GITHUB_SHA" --latest \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
          gh release upload "$TAG" "${files[@]}" --clobber
          if [ "$SIGNED" = yes ]; then
            gh release view "$TAG" --json assets > "$RUNNER_TEMP/assets.json"
            # Download links go through the API, as Tiro does (GitHub's plain release links sometimes time out).
            SIG="$B/$EXE.sig" EXE="$EXE" ASSETS="$RUNNER_TEMP/assets.json" OUT="$RUNNER_TEMP/latest.json" node -e '
              const fs = require("fs"), e = process.env;
              const api = Object.fromEntries(JSON.parse(fs.readFileSync(e.ASSETS, "utf8")).assets.map((a) => [a.name, a.apiUrl]));
              if (!api[e.EXE]) throw new Error(e.EXE + " is not on the release");
              const out = { version: e.VER, notes: "Tiro " + e.VER, pub_date: new Date().toISOString(),
                platforms: { "windows-x86_64": { signature: fs.readFileSync(e.SIG, "utf8").trim(), url: api[e.EXE] } } };
              fs.writeFileSync(e.OUT, JSON.stringify(out, null, 2));
            '
            cat "$RUNNER_TEMP/latest.json"
            gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber
          fi
          gh release edit "$TAG" --latest
          # Tidy up: the old single "Latest build" pre-release, and builds older than the 5 newest.
          gh release delete latest-build --cleanup-tag -y 2>/dev/null || true
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep '^v0\.2\.' | tail -n +6 | while read -r old; do gh release delete "$old" --cleanup-tag -y || true; done
          echo "Published Tiro $VER (auto-update: $SIGNED)"
