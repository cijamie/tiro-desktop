<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiro on the desktop</title>
<link rel="stylesheet" href="theme/tokens.css">
<style>
  /* Text is TiroDash's (theme/tokens.css): the system sans and monospace, no web fonts. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* Sized and moved by core.js to cover just what's drawn. */
  canvas { position: fixed; left: 0; top: 0; display: block; cursor: grab; touch-action: none; transform-origin: 0 0; will-change: transform;
    /* Never selectable: a stray triple-click or Select All tints a selected canvas solid grey over its whole box. */
    -webkit-user-select: none; user-select: none; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Tiro roaming the desktop"></canvas>
<script src="theme/tokens.js"></script>
<script src="overlay/core.js"></script>
<script src="overlay/markdown.js"></script>
<script src="overlay/sfx.js"></script>
<script src="overlay/voice-out.js"></script>
<script src="overlay/glass.js"></script>
<script src="overlay/minis.js"></script>
<script src="overlay/agent-home.js"></script>
<script src="overlay/agent.js"></script>
<script src="overlay/agent-tools.js"></script>
<script src="overlay/agent-cards.js"></script>
<script src="overlay/agent-panel.js"></script>
<script src="overlay/10-dither.js"></script>
<script src="overlay/12-sidekick.js"></script>
<script>Tiro.bootDesktop(document.getElementById("stage"));</script>
<script src="overlay/ink3d.js"></script>
<script src="overlay/world.js"></script>
<script src="overlay/ink.js"></script>
<script src="overlay/pen.js"></script>
<script src="overlay/readmark.js"></script>
<script src="overlay/ask-bar.js"></script>
<script src="overlay/host.js"></script>
</body>
</html>
